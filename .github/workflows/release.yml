name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            name: linux-x64
          - rid: linux-musl-x64
            name: linux-alpine-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish host
        run: |
          dotnet publish src/Bidibip/Bidibip.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out/${{ matrix.name }}

      - name: Build plugins
        run: |
          for csproj in src/plugins/*/Bidibip.Plugins.*.csproj; do
            dotnet build "$csproj" -c Release -o out/${{ matrix.name }}/plugins
          done

      - name: Write version file
        run: echo "${GITHUB_REF#refs/tags/}" > out/${{ matrix.name }}/version.txt

      - name: Package
        run: |
          cd out
          tar czf Bidibip-${{ matrix.name }}.tar.gz ${{ matrix.name }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bidibip-${{ matrix.name }}
          path: out/Bidibip-${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Bidibip-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker/
          push: true
          tags: ghcr.io/unreal-engine-fr/bidibip-v5:latest
